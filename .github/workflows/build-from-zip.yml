name: Build and Repackage KernelSU Module

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package
    runs-on: ubuntu-latest

    steps:
      # ۱. دریافت کدهای مخزن (شامل فایل زیپی که آپلود کرده‌اید)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ۲. پیدا کردن و استخراج فایل زیپ ماژول
      - name: Extract Original Zip
        run: |
          # پیدا کردن اولین فایل زیپ موجود در مسیر اصلی مخزن
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "خطا: هیچ فایل فشرده‌ای (zip) در مخزن پیدا نشد!"
            exit 1
          fi
          
          echo "در حال استخراج فایل: $ZIP_FILE"
          # فایل‌ها در پوشه build_env استخراج می‌شوند تا با فایل‌های گیت‌هاب تداخل پیدا نکنند
          unzip -q "$ZIP_FILE" -d build_env/

      # ۳. تنظیم مسیر NDK پیش‌فرض سرورهای گیت‌هاب
      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # ۴. ورود به پوشه src استخراج‌شده، اجرای بیلد و ساخت فایل‌های باینری
      - name: Build Core Binaries
        run: |
          cd build_env/src
          chmod +x build.sh
          ./build.sh all

      # ۵. بسته‌بندی مجدد به عنوان ماژول استاندارد KernelSU
      - name: Repackage KernelSU Module
        run: |
          cd build_env
          echo "در حال ساخت فایل زیپ نهایی..."
          # از داخل پوشه استخراج شده زیپ می‌کنیم تا module.prop دقیقا در روت فایل زیپ باشد
          # فایل‌های مخفی و پوشه‌های موقت بیلد (مثل src/.build-) حذف می‌شوند
          zip -r ../DirectPath-KernelSU-Release.zip . -x '.*' -x 'src/.build-*'

      # ۶. تحویل فایل نهایی و آماده نصب در بخش Artifacts
      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DirectPath-KernelSU-Module
          path: DirectPath-KernelSU-Release.zip
          retention-days: 14
          
